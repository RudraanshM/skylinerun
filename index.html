<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">
<title>Skyline Run</title>
<meta name="description" content="Skyline Run: solo platforming, two-player co-op, Loop Run, and two long Adventure campaigns.">
<style>
:root{--bg:#171b36;--panel:#232a52;--ink:#fdf3e2;--mint:#7fe3c1;--coral:#ff5d73;--gold:#ffd166;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
#root{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
body{background:var(--bg);color:var(--ink);font:600 15px "Avenir Next","Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none}
#wrap{position:relative;width:min(100vw,calc(100vh*1.6667));width:min(100vw,calc(100dvh*1.6667));aspect-ratio:5/3}
canvas{width:100%;height:100%;display:block;background:#232a5c}
#hud{position:absolute;left:10px;top:8px;font-size:13px;text-shadow:0 1px 3px #000a;pointer-events:none}
#toast{position:absolute;left:0;right:0;bottom:14%;text-align:center;font-size:16px;text-shadow:0 1px 4px #000;pointer-events:none;transition:opacity .5s;padding:0 10px}
#ui{position:absolute;inset:0;background:rgba(23,27,54,.95);overflow:auto;padding:18px 20px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#pb{position:absolute;top:6px;right:8px;padding:5px 10px;border-radius:6px;font-size:13px;border-left-width:0}
#ib{position:absolute;top:6px;right:80px;padding:5px 10px;font-size:13px;border-left-width:0}
#ib[hidden]{display:none}
#wrap.adventure #hud{white-space:pre-line;line-height:1.55;max-width:calc(100% - 165px);font-size:12px}
#wrap.adventure #toast{font-size:14px;background:#171b365c;padding:7px 16px;bottom:10%;line-height:1.4}
.grid.adventure-grid{grid-template-columns:1fr;max-width:650px}
.adventure-help{margin-top:16px;max-width:70ch;font-size:13px;font-weight:500;line-height:1.6;opacity:.8}
.pack-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 24px;margin-top:14px;max-width:700px}
.pack-list dt{color:var(--mint);font-size:16px;margin-bottom:3px}
.pack-list dd{font-weight:500;font-size:13px;line-height:1.4;opacity:.8}
.pack-list .missing{opacity:.42}
#pad.adventure button{width:56px;height:56px;font:700 12px system-ui}
#pad.adventure .adventure-actions{gap:7px}
#pad button.held{background:#7fe3c155;border-color:var(--mint)}
body:has(#ui:not([hidden])) #pad,#root:has(#ui:not([hidden])) #pad{visibility:hidden}
#wrap:has(#ui:not([hidden]))>#hud,#wrap:has(#ui:not([hidden]))>#toast,#wrap:has(#ui:not([hidden]))>#pb,#wrap:has(#ui:not([hidden]))>#ib{visibility:hidden}
canvas:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#ui[hidden]{display:none}
h1{margin:0 0 2px;font-size:30px;font-weight:800;letter-spacing:.5px}
p.s{margin:0 0 14px;opacity:.75;max-width:60ch;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid button,.btn{font:inherit;color:inherit;background:var(--panel);border:0;border-left:5px solid var(--c,var(--mint));border-radius:6px;padding:10px 12px;text-align:left;cursor:pointer}
.grid button:hover,.btn:hover{background:#2e3768}
.btn.on{background:#3a4480;--c:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid b{font-size:20px;display:block}
.grid small{display:block;opacity:.7;font-weight:500;margin-top:3px;line-height:1.3}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
#pad{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;padding:0 14px;pointer-events:none;z-index:5}
#pad div{display:flex;gap:10px}
#pad button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid #fff6;background:#ffffff22;color:var(--ink);font:700 13px inherit;touch-action:none}
#pad button.p2{border-color:#7fe3c1aa}
#pad.co button{width:56px;height:56px}
#pad.lp button{width:90px;height:90px}
#rot{display:none;position:fixed;top:0;left:0;right:0;text-align:center;background:#232a52;padding:6px;font-size:13px;z-index:6}
@media (pointer:coarse){#pad{display:flex}#pb{padding:8px 14px;font-size:15px}}
@media (pointer:coarse) and (orientation:portrait){#rot{display:block}}
@media (max-width:600px){h1{font-size:24px}.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}.grid b{font-size:16px}#pad.co button{width:46px;height:46px;font-size:11px}#pad.co div{gap:6px}}
@media (pointer:coarse){#ib{padding:8px 12px;right:92px;font-size:15px}#wrap.adventure #hud{max-width:calc(100% - 185px)}}
@media (max-width:600px){.grid.adventure-grid{grid-template-columns:1fr}#pad.adventure button{width:46px;height:46px;font-size:11px}#pad.adventure .adventure-actions{display:grid;grid-template-columns:repeat(3,46px);gap:6px}#pad.adventure>div:first-child{align-self:end;gap:6px}#wrap.adventure #hud{font-size:10px;line-height:1.35;max-width:calc(100% - 170px)}#wrap.adventure #toast{font-size:12px;bottom:5%;line-height:1.3}.pack-list{grid-template-columns:1fr}}
</style></head><body>

  { name: 'Snowdrift Quarry', gear: 'bombs', rest: 108, shelves: [[54, 57, 4], [89, 55, 5], [164, 56, 4]], colors: ['#20253f', '#8f9fb8', '#343a58', '#4d5675', '#cfe1f2'], mobs: ['golem', 'bat', 'crawler', 'golem', 'slime', 'golem'], gaps: [[45, 47], [139, 142]], rubble: [32, 130], cache: true },

function buildAdventureWorld() {
  const world = { level: 0, solids: [], hazards: [], enemies: [], pickups: [], rings: [], ladders: [], levers: [], camps: [], signs: [], water: [], storms: [], heaters: [], turrets: [], anchors: [], regions: REGIONS, bossId: 'hollow-guardian', length: REGIONS.length * REGION_TILES * TILE };

}
function buildFrozenWorld() {

      this.sigils.add(item.item);
      p.hp = this.maxHp;
      this.refreshGates();
      this.notify(`${this.meta.relicOne} recovered (${this.sigils.size}/3). ${this.meta.foundTail}`, 240);
    } else if (item.kind === 'heart') {
      this.maxHp = 6; p.hp = 6;
      this.notify('A heart crystal! Maximum health increased to six.', 180);
    } else if (item.kind === 'chest') {
      this.treasures++; p.hp = this.maxHp;
      this.notify('Explorer cache found. Health restored!', 150);
    } else p.hp = Math.min(this.maxHp, p.hp + 2);
    this.burst(item.x + 12, item.y + 12, item.kind === 'sigil' ? '#ffd166' : '#7fe3c1', 16);
    this.persist();
  }

  fireEnemy(enemy, { speed = 3.2, damage = 1, angleOffset = 0, ground = false, arc = false } = {}) {
    const p = this.player;
    if (arc) {
      const sx = enemy.x + enemy.w / 2;
      this.shots.push({ x: sx, y: enemy.y + 6, w: 12, h: 12, vx: clamp((p.x + 11 - sx) / 48, -5, 5), vy: -6, life: 160, friendly: false, damage, color: '#f4fbff', arc: true });
      return;
    }
    const x = enemy.x + enemy.w / 2;
    const y = ground ? FLOOR - 14 : enemy.y + enemy.h * 0.4;
    const angle = ground ? (p.x > x ? 0 : Math.PI) : Math.atan2(p.y + 14 - y, p.x + 11 - x) + angleOffset;
    this.shots.push({ x, y, w: ground ? 24 : 9, h: ground ? 14 : 9, vx: Math.cos(angle) * speed, vy: ground ? 0 : Math.sin(angle) * speed, life: 190, friendly: false, damage, color: { spitter: '#b8e58e', wyrm: '#bfe9ff' }[enemy.type] || '#ff987c', ground });
  }

  updatePrismTurrets() {
    if (this.level !== 1) return;
    for (const turret of this.world.turrets) {
      const gate = this.world.solids.find((block) => block.id === turret.gate);
      if (!gate || gate.gone || this.player.x >= gate.x + gate.w || Math.abs(turret.x - this.player.x) > 365) continue;
      turret.clock++;
      if (turret.clock % 100 !== 15) continue;
      const x = turret.x - 7, y = turret.y + 12;
      const angle = Math.atan2(this.player.y + 14 - y, this.player.x + 11 - x);
      this.shots.push({ x, y, w: 14, h: 14, vx: Math.cos(angle) * 3.8, vy: Math.sin(angle) * 3.8, life: 145, friendly: false, reflectable: true, targetGate: gate.id, damage: 1, color: '#a9a4ff' });
    }
  }

  updateFrostBoss(enemy) {
    const p = this.player;
    if (Math.abs(enemy.x - p.x) > 670) return;
    enemy.x = enemy.homeX + Math.sin(enemy.clock * 0.016) * 18;
    enemy.y = enemy.homeY + Math.sin(enemy.clock * 0.04) * 9;
    enemy.face = p.x < enemy.x ? -1 : 1;
    if (enemy.exposed > 0) enemy.exposed--;
    const anchorsLeft = this.world.anchors.some((anchor) => !anchor.broken);
    enemy.state = enemy.exposed > 0 ? 'exposed' : enemy.clock % 150 > 110 ? 'casting' : anchorsLeft ? 'anchored' : 'warded';
    const rapid = !anchorsLeft && enemy.hp < enemy.maxHp * 0.75;
    if (enemy.clock % (rapid ? 90 : 125) === 25) {
      const x = enemy.x + (enemy.face < 0 ? 22 : enemy.w - 22), y = enemy.y + enemy.h * 0.7;
      const angle = Math.atan2(p.y + p.h / 2 - y, p.x + p.w / 2 - x);
      this.shots.push({ x, y, w: 14, h: 14, vx: Math.cos(angle) * 3.5, vy: Math.sin(angle) * 3.5, life: 230, friendly: false, reflectable: true, targetBoss: enemy.id, damage: 1, color: '#b6a9ff' });
    }
    if (enemy.clock % (rapid ? 155 : 190) === 90) {
      for (const offset of [-85, 65]) this.icefalls.push({ x: clamp(p.x + offset, enemy.homeX - 790, enemy.homeX + 650), y: FLOOR - 340, w: 23, h: 37, vy: 0, warn: 42, life: 140 });
    }
    if (enemy.clock % 245 === 155) {
      this.shots.push({ x: enemy.x + enemy.w / 2, y: FLOOR - 19, w: 28, h: 17, vx: enemy.face * 4.3, vy: 0, life: 165, friendly: false, damage: 1, frost: true, ground: true, color: '#b9e7ff' });
    }
  }

  updateIcefalls() {
    for (const shard of this.icefalls) {
      if (shard.warn > 0) { shard.warn--; continue; }
      shard.vy = Math.min(14, shard.vy + 0.65);
      shard.y += shard.vy;
      shard.life--;
      if (overlaps(shard, this.player)) { this.hurt(1, shard.x + shard.w / 2, false); shard.life = 0; }
      if (shard.y + shard.h >= FLOOR) { this.burst(shard.x + 10, FLOOR - 7, '#bfe9ff', 6); shard.life = 0; }
    }
    this.icefalls = this.icefalls.filter((shard) => shard.life > 0);
  }

  updateCold(pool) {
    if (this.level !== 1) return;
    const p = this.player;
    const storm = this.world.storms.some((zone) => overlaps(p, zone));
    const heater = this.world.heaters.some((fire) => Math.hypot(fire.x - p.x, fire.y - p.y) < 128);
    p.warmth = clamp(p.warmth + (heater ? 1.9 : storm ? -0.42 : pool ? -0.18 : 0.22), 0, 100);
    if (storm && !p.grounded) p.vx -= 0.18;
    if (p.warmth < 1 && this.frame % 85 === 0) this.hurt(1, p.x + p.w / 2, false);
  }

  updateEnemies() {
    const p = this.player;
    for (const enemy of this.world.enemies) {
      if (enemy.dead || Math.abs(enemy.x - p.x) > 850) continue;
      enemy.clock++;
      enemy.flash = Math.max(0, (enemy.flash || 0) - 1);
      const distance = Math.abs(enemy.x - p.x);
      const direction = Math.sign(p.x - enemy.x) || -1;
      if (enemy.type === 'wyrm') {
        this.updateFrostBoss(enemy);
      } else if (ENEMIES[enemy.type].boss) {
        if (distance > 700) continue;
        enemy.face = direction;
        const phase = enemy.clock % 200;
        enemy.state = phase < 38 ? 'warn' : phase < 78 ? 'charge' : phase < 120 ? 'recover' : 'attack';
        enemy.vx = enemy.state === 'charge' ? direction * (enemy.hp < 16 ? 3.5 : 2.5) : 0;
        enemy.vy = 0.55;
        this.move(enemy);
        enemy.x = clamp(enemy.x, enemy.homeX - 9 * TILE, enemy.homeX + 12 * TILE);
        if (phase === 125) for (const angleOffset of [-0.22, 0, 0.22]) this.fireEnemy(enemy, { speed: 3, angleOffset });
        if (phase === 168 || (phase === 186 && enemy.hp < 16)) this.fireEnemy(enemy, { speed: 4, ground: true });
      } else if (enemy.type === 'bat' || enemy.type === 'wisp') {
        const dive = Math.sin(enemy.clock * 0.024);
        const targetX = distance < 290 ? clamp(p.x, enemy.homeX - 200, enemy.homeX + 200) : enemy.homeX;
        const targetY = distance < 290 && dive > 0.45 ? p.y + 4 : enemy.homeY + Math.sin(enemy.clock * 0.04) * 24;
        enemy.x += clamp((targetX - enemy.x) * 0.023, -1.8, 1.8);
        enemy.y += clamp((targetY - enemy.y) * 0.025, -1.5, 1.5);
        enemy.face = direction;
        if (enemy.type === 'wisp' && distance < 390 && enemy.clock % 150 === 0) this.fireEnemy(enemy, { speed: 2.4 });
      } else if (enemy.type === 'spitter' || enemy.type === 'sentry') {
        enemy.face = direction;
        if (distance < 470) {
          enemy.cooldown--;
          enemy.state = enemy.cooldown < 25 ? 'warn' : 'patrol';
          if (enemy.cooldown <= 0) { this.fireEnemy(enemy, { speed: enemy.type === 'sentry' ? 4 : 2.8 }); enemy.cooldown = 125; }
        }
      } else {
        let speed = { crawler: 1.15, slime: 0.7, golem: 0.6, yeti: 0.5, mimic: 1.7 }[enemy.type] ?? 1.35;
        if (enemy.type === 'mimic') { if (enemy.state === 'sleep' && distance > 90) speed = 0; else enemy.state = 'awake'; }
        if (enemy.type === 'charger') {
          const cycle = enemy.clock % 170;
          enemy.state = cycle < 38 ? 'warn' : cycle < 92 ? 'charge' : 'recover';
          if (cycle === 38) enemy.chargeDirection = direction;
          speed = enemy.state === 'charge' ? 3.7 : 0;
          enemy.face = enemy.state === 'charge' ? (enemy.chargeDirection || direction) : direction;
        } else if (distance < 250) enemy.face = direction;
        else if (Math.abs(enemy.x - enemy.homeX) > 90) enemy.face = Math.sign(enemy.homeX - enemy.x);
        enemy.state = enemy.type === 'guard' ? (distance < 90 ? 'attack' : 'patrol') : enemy.state;
        const nextX = enemy.x + (enemy.face > 0 ? enemy.w + speed + 8 : -speed - 8);
        enemy.vx = this.supports(nextX, enemy.y + enemy.h) ? enemy.face * speed : 0;
        if (enemy.grounded && ((enemy.type === 'slime' && enemy.clock % 90 === 0) || (enemy.type === 'mimic' && enemy.state === 'awake' && enemy.clock % 45 === 0))) enemy.vy = enemy.type === 'mimic' ? -6 : -5;
        enemy.vy = Math.min(enemy.vy + 0.55, 10);
        this.move(enemy);
        if (enemy.type === 'yeti' && distance < 420 && enemy.clock % 140 === 70) this.fireEnemy(enemy, { arc: true });
      }
      if (overlaps(p, enemy)) {
        const stomp = p.vy > 1 && p.y + p.h < enemy.y + Math.min(enemy.h * 0.7, 24) && !ENEMIES[enemy.type].noStomp;
        if (stomp) { this.damageEnemy(enemy, 2, p.x); p.vy = -8; p.airJump = 1; }
        else this.hurt(ENEMIES[enemy.type].boss ? 2 : 1, enemy.x + enemy.w / 2);
      }
    }
  }

  updateShots() {
    for (const shot of this.shots) {
      if (shot.reflected) {
        const target = shot.targetGate
          ? this.world.solids.find((block) => block.id === shot.targetGate && !block.gone)
          : shot.targetAnchor
          ? this.world.anchors.find((anchor) => anchor.id === shot.targetAnchor && !anchor.broken)
          : this.world.enemies.find((enemy) => enemy.id === shot.targetBoss && !enemy.dead);
        if (!target) { shot.life = 0; continue; }
        const dx = target.x + target.w / 2 - shot.x - shot.w / 2;
        const dy = target.y + target.h / 2 - shot.y - shot.h / 2;
        const d = Math.hypot(dx, dy) || 1;
        shot.vx = dx / d * 10;
        shot.vy = dy / d * 10;
      }
      if (shot.arc) shot.vy += 0.25;
      if (shot.bomb) shot.vy += 0.35;
      shot.x += shot.vx; shot.y += shot.vy; shot.life--;
      if (shot.bomb) {
        if (shot.life <= 0 || this.world.enemies.some((item) => !item.dead && overlaps(shot, item)) || this.colliders(shot.x, shot.w).some((block) => overlaps(shot, block))) this.explode(shot);
        continue;
      }
      if (shot.reflected && shot.targetGate) {
        const gate = this.world.solids.find((block) => block.id === shot.targetGate);
        if (gate && !gate.gone && overlaps(shot, gate)) {
          gate.gone = true;
          this.broken.add(gate.id);
          shot.life = 0;
          this.burst(gate.x + 16, FLOOR - 90, '#b9a6ff', 20);
          this.notify('The prism lock shatters. The way forward is open!', 150);
          this.persist();
        }
        continue;
      }
      if (shot.reflected && shot.targetAnchor) {
        const anchor = this.world.anchors.find((item) => item.id === shot.targetAnchor);
        if (anchor && !anchor.broken && overlaps(shot, anchor)) {
          anchor.broken = true;
          shot.life = 0;
          this.burst(anchor.x + anchor.w / 2, anchor.y + anchor.h / 2, '#c8b8ff', 24);
          const remaining = this.world.anchors.filter((item) => !item.broken).length;
          if (remaining === 0) {
            const boss = this.world.enemies.find((enemy) => enemy.id === this.world.bossId);
            if (boss && !boss.dead) { boss.exposed = 280; boss.state = 'exposed'; }
            this.notify('Both anchors shattered! Bomb the Wyrm\'s exposed heart!', 210);
          } else this.notify(`Crystal anchor shattered. ${remaining} left. Reflect the next bolt!`, 150);
        }
        continue;
      }
      if (shot.reflected && shot.targetBoss) {
        const boss = this.world.enemies.find((enemy) => enemy.id === shot.targetBoss && !enemy.dead);
        if (boss && overlaps(shot, boss)) {
          boss.exposed = 235;
          boss.state = 'exposed';
          this.damageEnemy(boss, 2, shot.x, true);
          shot.life = 0;
          this.notify('Ward broken! The heart glows: attack now!', 120);
        }
        continue;
      }
      if (shot.friendly) {
        const enemy = this.world.enemies.find((item) => !item.dead && overlaps(shot, item));
        if (enemy) { this.damageEnemy(enemy, shot.damage, shot.x - shot.vx * 3, true); shot.life = 0; }
      } else if (overlaps(shot, this.player)) {
        const p = this.player;
        const fromX = shot.x + shot.w / 2;
        if (shot.reflectable && p.guard && p.stamina >= 14 && Math.sign(fromX - p.x - p.w / 2) === p.face) {
          p.stamina -= 14;
          p.invulnerable = 12;
          shot.friendly = true;
          shot.reflected = true;
          if (shot.targetBoss) {
            const anchor = this.world.anchors.find((item) => !item.broken);
            if (anchor) shot.targetAnchor = anchor.id;
          }
          shot.life = 150;
          shot.color = '#d2c0ff';
          shot.x = p.x + (p.face > 0 ? p.w + 5 : -shot.w - 5);
          shot.y = p.y + 7;
          this.burst(p.x + p.w / 2, p.y + 14, '#bca6ff', 12);
        } else {
          const hit = this.hurt(shot.damage, fromX);
          if (hit && shot.frost && this.level === 1) p.warmth = Math.max(0, p.warmth - 12);
          shot.life = 0;
        }
      }
      if (!shot.reflected && this.colliders(shot.x, shot.w).some((block) => block.id !== shot.targetGate && overlaps(shot, block))) shot.life = 0;
    }
    this.shots = this.shots.filter((shot) => shot.life > 0);
  }

  update(input = {}) {
    if (!this.running || this.complete) return;
    this.frame++; this.time++;
    for (const item of this.particles) { item.x += item.vx; item.y += item.vy; item.vy += 0.08; item.life--; }
    this.particles = this.particles.filter((item) => item.life > 0);
    if (this.respawnIn > 0) { if (--this.respawnIn === 0) this.spawn(); return; }
    const p = this.player;
    const jumpPressed = input.jump && !this.lastInput.jump;
    const swapPressed = input.swap && !this.lastInput.swap;
    const guardPressed = input.guard && !this.lastInput.guard;
    this.lastInput = { ...input };
    for (const key of ['invulnerable', 'attackCd', 'swing', 'toolCd', 'hookCd', 'recoil', 'guardBroken', 'mining']) if (p[key] > 0) p[key]--;
    if (swapPressed) {
      const list = this.weapons();
      if (list.length > 1) { this.weapon = list[(list.indexOf(this.weapon) + 1) % list.length]; this.persist(); }
      else this.notify(this.meta.swapHint, 150);
    }
    const direction = Number(!!input.right) - Number(!!input.left);
    if (direction) p.face = direction;
    const onIce = p.grounded && this.colliders(p.x).some((block) => block.kind === 'ice' && overlaps({ x: p.x + 4, y: p.y + p.h, w: p.w - 8, h: 3 }, block));
    if (p.skateCd > 0) p.skateCd--;
    if (this.level === 1 && guardPressed && onIce && this.gear.has('skates') && p.skateCd === 0) {
      p.skateDash = 26;
      p.skateCd = 80;
      p.vy = -2;
      p.grounded = false;
      this.burst(p.x + 11, p.y + 28, '#a8e9ff', 12);
    }
    if (p.skateDash > 0) {
      p.skateDash--;
      p.vx = p.face * 11;
      p.vy = p.skateDash > 5 ? -0.4 : 0.4;
    }
    p.guard = !!input.guard && (this.gear.has('shield') || this.gear.has('prism')) && p.stamina > 0 && !p.guardBroken && !p.skateDash;
    p.stamina = clamp(p.stamina + (p.guard ? (this.level === 1 ? -0.32 : -0.45) : this.level === 1 ? 0.95 : 0.8), 0, 100);
    if (p.stamina <= 0) p.guardBroken = 75;
    if (!p.recoil && !p.grapple && !p.skateDash) {
      if (direction) p.vx = clamp(p.vx + direction * (p.grounded ? (onIce ? 0.22 : 0.8) : 0.5), -4.5, 4.5);
      else p.vx *= p.grounded ? (onIce ? 0.985 : 0.72) : 0.94;
      if (p.guard) p.vx *= 0.65;
    }
    if (p.grounded) { p.coyote = 6; p.airJump = 1; }
    else p.coyote--;
    if (jumpPressed) p.jumpBuffer = 7;
    if (p.jumpBuffer > 0) {
      p.jumpBuffer--;
      if (p.coyote > 0 || (this.gear.has('boots') && p.airJump > 0 && jumpPressed)) {
        if (p.coyote <= 0) { p.airJump--; this.burst(p.x + 11, p.y + 30, '#c8b2ff', 8); }
        p.vy = -11.5; p.grounded = false; p.coyote = 0; p.jumpBuffer = 0;
      }
    }
    const pool = this.world.water.find((zone) => overlaps({ x: p.x + 10, y: p.y + 15, w: 2, h: 2 }, zone));
    p.swimming = !!pool;
    if (p.leapCd > 0) p.leapCd--;
    if (pool) {
      p.vy = Math.min(p.vy + 0.15, 2.2);
      if (input.jump) p.vy = Math.max(p.vy - 0.75, -4);
      if (input.jump && p.y + 15 < pool.y + 6 && !(p.leapCd > 0)) { p.vy = -9.5; p.leapCd = 30; }
      p.vx = clamp(p.vx, -3, 3);
      p.airJump = 1;
    } else {
      if (!input.jump && p.vy < -4 && !p.grapple) p.vy *= 0.7;
      p.vy = Math.min(p.vy + 0.55, 13);
    }
    if (p.skateDash > 0) p.vy = p.skateDash > 5 ? -0.4 : 0.4;
    p.gliding = this.gear.has('glider') && !!input.jump && p.vy > 0 && !p.grounded && !p.grapple;
    if (p.gliding) { p.vy = Math.min(p.vy, 1.8); if (direction) p.vx = direction * 5.2; }
    p.climbing = false;
    if (this.gear.has('claws') && !p.grounded && direction && !p.grapple) {
      const probe = { x: direction > 0 ? p.x + p.w : p.x - 3, y: p.y + 4, w: 3, h: p.h - 8 };
      if (this.colliders(p.x).some((block) => block.kind === 'rock' && overlaps(probe, block))) { p.climbing = true; p.vy = input.jump ? -3.6 : Math.min(p.vy, 1.2); p.airJump = 1; }
    }
    if (input.tool) this.useTool();
    else if (p.grapple) { p.grapple = null; p.hookCd = 8; }
    if (p.grapple) {
      const dx = p.grapple.x - p.x - 11;
      const dy = p.grapple.y - p.y;
      const distance = Math.hypot(dx, dy);
      if (distance < 24) { p.grapple = null; p.hookCd = 45; p.vx = p.face * 3; p.vy = -3; }
      else { p.vx = dx / distance * 8.5; p.vy = dy / distance * 8.5; p.airJump = 1; }
    }
    if (this.world.ladders.some((ladder) => overlaps(p, ladder))) {
      p.vy = input.jump ? -3.5 : Math.min(p.vy, 1.5);
      p.airJump = 1;
    }
    this.move(p);
    this.updateCold(pool);
    if (input.attack) this.attack();
    if (p.swing > 0) {
      const blade = { x: p.face > 0 ? p.x + 8 : p.x - 58, y: p.y - 16, w: 72, h: 62 };
      for (const enemy of this.world.enemies) if (!enemy.dead && !this.swingHits.has(enemy.id) && overlaps(blade, enemy)) {
        this.swingHits.add(enemy.id);
        this.damageEnemy(enemy, 2, p.x);
      }
    }
    this.updateEnemies();
    this.updatePrismTurrets();
    this.updateShots();
    this.updateIcefalls();
    for (const hazard of this.world.hazards) {
      const active = hazard.kind !== 'vent' || (this.frame + hazard.phase) % 180 > 95;
      if (active && overlaps(p, hazard)) this.hurt(hazard.kind === 'lava' ? 2 : 1, hazard.x + hazard.w / 2, false);
    }
    if (p.y > FLOOR + 310) { this.die(); return; }
    if (this.respawnIn) return;
    for (const item of this.world.pickups) {
      if (item.kind === 'chest') continue;
      const radius = item.kind === 'gear' || item.kind === 'sigil' ? 60 : 32;
      if (Math.hypot(item.x - p.x, item.y - p.y) < radius) this.collect(item);
    }
    if (this.campMessageCooldown > 0) this.campMessageCooldown--;
    this.world.camps.forEach((camp, index) => {
      if (index > this.camp && Math.abs(p.x - camp.x) < 58 && Math.abs(p.y + p.h - camp.y) < 40) {
        this.camp = index;
        p.hp = this.maxHp; p.stamina = 100; p.warmth = 100;
        this.persist();
        this.notify(`${camp.name}: health restored. ${this.saved ? 'Journey saved.' : 'Keep this tab open: browser saving is unavailable.'}`, 180);
        this.burst(camp.x, camp.y - 36, '#ffd166', 12);
      }
    });
    for (const sign of this.world.signs) if (!this.shownSigns.has(sign.x) && Math.abs(p.x - sign.x) < 50) {
      this.shownSigns.add(sign.x);
      this.notify(sign.text, 300);
    }
    this.region = clamp(Math.floor(p.x / (REGION_TILES * TILE)), 0, this.world.regions.length - 1);
    this.camera.x += (clamp(p.x - 310 + p.vx * 12, 0, this.world.length - 800) - this.camera.x) * 0.1;
    this.camera.y += (p.y - 280 - this.camera.y) * 0.075;
    if (this.time % 600 === 0) this.persist();
    if (overlaps(p, this.world.goal) && this.sigils.size === 3 && this.defeated.has(this.world.bossId)) {
      this.complete = true;
      this.persist();
      this.onWin({ time: this.time / 60, deaths: this.deaths, treasures: this.treasures, enemies: this.defeated.size });
    }
  }

  get objective() {
    if (this.defeated.has(this.world.bossId)) return this.meta.goal;
    if (this.sigils.size === 3) return this.meta.bossGoal;
    return `Recover the three ${this.meta.relic}. Found: ${this.sigils.size}/3.`;
  }

  statusText() {
    const warmth = this.level === 1 ? `  |  Warmth ${Math.ceil(this.player.warmth)}%` : '';
    return `${this.world.regions[this.region].name}  |  HP ${this.player.hp}/${this.maxHp}  |  ${WEAPON_NAMES[this.weapon]} [Q]${warmth}\n${this.objective}`;
  }

  explode(shot) {
    shot.life = 0;
    const cx = shot.x + shot.w / 2, cy = shot.y + shot.h / 2, radius = 72;

 L.C.forEach((c,i)=>{g.fillStyle='#fdf3e2';g.fillRect(c.x,c.y-48,3,48);g.fillStyle=i<=cp?'#7fe3c1':'#8a90b8';g.fillRect(c.x+3,c.y-48,16,11)});const G=L.G;g.fillStyle='#fdf3e2';g.fillRect(G.x+4,G.y,4,64);g.fillStyle='#ffd166';g.beginPath();g.moveTo(G.x+8,G.y);g.lineTo(G.x+34,G.y+12);g.lineTo(G.x+8,G.y+24);g.fill();
 for(const q of part){g.globalAlpha=Math.max(0,q.l/20);g.fillStyle=q.c;g.fillRect(q.x,q.y,5,5)}g.globalAlpha=1;
 if(MD)drawX();
 else if(!dead){g.fillStyle=L.ab.j&&p.djc>0?'#b9a58f':'#fdf3e2';if(L.ab.j&&p.djc>0){g.fillRect(p.x-2,p.y-8,26*(1-p.djc/300),3)}g.fillRect(p.x,p.y,p.w,p.h);
  g.fillStyle='#171b36';g.fillRect(p.x+(p.face>0?13:3),p.y+7,6,6)}
 g.restore();
 if(MD==0&&L.Z.some(z=>z.dark&&ov(p,z))){const sx=p.x+11-(cam.x|0),sy=p.y+15-(cam.y|0),dg=g.createRadialGradient(sx,sy,50,sx,sy,190);dg.addColorStop(0,'rgba(5,5,15,0)');dg.addColorStop(1,'rgba(5,5,15,.97)');g.fillStyle=dg;g.fillRect(0,0,800,480)}

}
function tick(){
 for(const q of part){q.x+=q.vx;q.y+=q.vy;q.l--}part=part.filter(q=>q.l>0);

}

 while(acc>16.67){acc-=16.67;tick()}

const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j',ShiftLeft:'d',ShiftRight:'d',KeyX:'d',KeyK:'d'};
const KC={KeyA:'1l',KeyD:'1r',KeyW:'1j',Space:'1j',ArrowLeft:'2l',ArrowRight:'2r',ArrowUp:'2j',Enter:'2j',Numpad0:'2j'};
const KA={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j',KeyJ:'a',KeyF:'a',KeyE:'e',KeyQ:'q',ShiftLeft:'g',ShiftRight:'g'};
const inputSources=new Map();
function clearControls(){inputSources.clear();for(const k of [K,K1,K2]){for(const key of Object.keys(k))k[key]=false;k.jp=0;k.dp=0}adventure.clearInput();$('pad').querySelectorAll('button').forEach(b=>{b.classList.remove('held');b.setAttribute('aria-pressed','false')})}
function setControl(k,on,source){const before=[...inputSources.values()].includes(k);if(on)inputSources.set(source,k);else inputSources.delete(source);const after=[...inputSources.values()].includes(k);if(before!==after)press(k,after);$('pad').querySelectorAll('button').forEach(b=>{const held=[...inputSources.values()].includes(b.dataset.k);b.classList.toggle('held',held);b.setAttribute('aria-pressed',String(held))})}
function press(k,on){
 if(k.length==2){const q=k[0]=='1'?K1:K2,a=k[1];if(a=='j'){q.jh=on;if(on)q.jp=7}else q[a]=on;return}
 if(k=='l'||k=='r')K[k]=on;
 else if(k=='j'){K.jh=on;if(on)K.jp=7}
 else if(k=='d'&&on)K.dp=7;
 else if(['a','e','q','g'].includes(k))K[k+'h']=on;
}

 pd.querySelectorAll('button').forEach(b=>{
  b.setAttribute('aria-label',b.dataset.k==='g'&&m===3&&adventure.level===1?'Skill: skate on ice or reflect frost bolts':b.textContent+(m===3?' (Adventure)':''));

  ['pointerup','pointercancel','lostpointercapture'].forEach(v=>listen(b,v,e=>setControl(b.dataset.k,false,'pointer-'+e.pointerId)));

}
listen(cv,'pointerdown',e=>{if((MD==2||MD===3)&&st==1){e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}setControl(MD===3?'a':'j',true,'pointer-'+e.pointerId)}});
['pointerup','pointercancel','lostpointercapture'].forEach(v=>listen(window,v,e=>{const source='pointer-'+e.pointerId,k=inputSources.get(source);if(k)setControl(k,false,source)}));

menu(0);animationFrame=requestAnimationFrame(loop);
