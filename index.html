<html lang="en"><head><meta charset="utf-8">

<title>Skyline Run</title>
<style>
:root{--bg:#171b36;--panel:#232a52;--ink:#fdf3e2;--mint:#7fe3c1;--coral:#ff5d73;--gold:#ffd166;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

#hud{position:absolute;left:10px;top:8px;font-size:13px;text-shadow:0 1px 3px #000a;pointer-events:none}
#toast{position:absolute;left:0;right:0;bottom:14%;text-align:center;font-size:16px;text-shadow:0 1px 4px #000;pointer-events:none;transition:opacity .5s}
#ui{position:absolute;inset:0;background:rgba(23,27,54,.95);overflow:auto;padding:18px 20px}
#pb{position:absolute;top:6px;right:8px;padding:5px 10px;border-radius:6px;font-size:13px;border-left-width:0}
#ui[hidden]{display:none}
h1{margin:0 0 2px;font-size:30px;font-weight:800;letter-spacing:.5px}
p.s{margin:0 0 14px;opacity:.75;max-width:60ch;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid button,.btn{font:inherit;color:inherit;background:var(--panel);border:0;border-left:5px solid var(--c,var(--mint));border-radius:6px;padding:10px 12px;text-align:left;cursor:pointer}
.grid button:hover,.btn:hover{background:#2e3768}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid b{font-size:20px;display:block}
.grid small{display:block;opacity:.7;font-weight:500;margin-top:3px;line-height:1.3}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
#pad{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;padding:0 14px;pointer-events:none}
#pad div{display:flex;gap:10px}
#pad button{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid #fff6;background:#ffffff22;color:var(--ink);font:700 13px inherit}
@media (pointer:coarse){#pad{display:flex}}
</style></head><body>

 L.C.forEach((c,i)=>{g.fillStyle='#fdf3e2';g.fillRect(c.x,c.y-48,3,48);g.fillStyle=i<=cp?'#7fe3c1':'#8a90b8';g.fillRect(c.x+3,c.y-48,16,11)});const G=L.G;g.fillStyle='#fdf3e2';g.fillRect(G.x+4,G.y,4,64);g.fillStyle='#ffd166';g.beginPath();g.moveTo(G.x+8,G.y);g.lineTo(G.x+34,G.y+12);g.lineTo(G.x+8,G.y+24);g.fill();
 for(const q of part){g.globalAlpha=Math.max(0,q.l/20);g.fillStyle=q.c;g.fillRect(q.x,q.y,5,5)}g.globalAlpha=1;
 if(!dead){g.fillStyle=L.ab.j&&p.djc>0?'#b9a58f':'#fdf3e2';if(L.ab.j&&p.djc>0){g.fillRect(p.x-2,p.y-8,26*(1-p.djc/300),3)}g.fillRect(p.x,p.y,p.w,p.h);
  g.fillStyle='#171b36';g.fillRect(p.x+(p.face>0?13:3),p.y+7,6,6)}
 g.restore();
 if(L.Z.some(z=>z.dark&&ov(p,z))){const sx=p.x+11-(cam.x|0),sy=p.y+15-(cam.y|0),dg=g.createRadialGradient(sx,sy,50,sx,sy,190);dg.addColorStop(0,'rgba(5,5,15,0)');dg.addColorStop(1,'rgba(5,5,15,.97)');g.fillStyle=dg;g.fillRect(0,0,800,480)}
}
function tick(){
 for(const q of part){q.x+=q.vx;q.y+=q.vy;q.l--}part=part.filter(q=>q.l>0);
 if(st==1){if(dead){if(--dead==0)reset()}else step();
  if(toast&&!--toast)$('toast').style.opacity=0}
}
let last=0,acc=0;
function loop(t){requestAnimationFrame(loop);acc+=Math.min(t-last,100);last=t;
 while(acc>16.67){acc-=16.67;tick()}
 if(st){draw();if(f%6==0)$('hud').textContent=(cur+1)+'. '+L.nm+'   falls '+deaths+'   '+(tm/60).toFixed(1)+'s'}}
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j',ShiftLeft:'d',ShiftRight:'d',KeyX:'d',KeyK:'d'};
function press(k,on){
 if(k=='l'||k=='r')K[k]=on;
 else if(k=='j'){K.jh=on;if(on)K.jp=7}
 else if(k=='d'&&on)K.dp=7;
}
addEventListener('keydown',e=>{
 if(e.code=='Escape'){st==1?pause():st==3?resume():0;return}
 if(e.code=='KeyR'&&st==1){deaths++;reset();return}
 const k=KM[e.code];if(k){e.preventDefault();if(!e.repeat)press(k,true)}});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)press(k,false)});
document.querySelectorAll('#pad button').forEach(b=>{
 b.addEventListener('pointerdown',e=>{e.preventDefault();press(b.dataset.k,true)});
 ['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>press(b.dataset.k,false)))});
addEventListener('blur',()=>{K.l=K.r=false});
menu();requestAnimationFrame(loop);
